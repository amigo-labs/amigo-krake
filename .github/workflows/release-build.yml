name: Release Build

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.2.0)"
        required: true
        type: string
      version:
        description: "Version without v prefix (e.g. 0.2.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Ed25519 *public* keys pinned into the binaries for plugin-registry and
  # self-update signature verification. Both are the update key: the plugin
  # registry index is signed with AMIGO_UPDATE_SIGNING_KEY too
  # (Entscheidung 17, docs/specs/plugin-registry.md). `build.rs` refuses a release build
  # without them (or with the all-zero placeholder). They are public, so they
  # are repository variables, not secrets: Settings → Secrets and variables →
  # Actions → Variables.
  KRAKE_REGISTRY_PUBKEY_HEX: ${{ vars.AMIGO_UPDATE_PUBKEY_HEX }}
  KRAKE_UPDATE_PUBKEY_HEX: ${{ vars.AMIGO_UPDATE_PUBKEY_HEX }}

permissions:
  contents: write
  packages: write

jobs:
  # ─── CLI + Server Binaries ─────────────────────────────────────────
  cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cli_archive: krake-linux-x86_64.tar.gz
            server_archive: krake-server-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cli_archive: krake-linux-aarch64.tar.gz
            server_archive: krake-server-linux-aarch64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cli_archive: krake-macos-x86_64.tar.gz
            server_archive: krake-server-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            cli_archive: krake-macos-aarch64.tar.gz
            server_archive: krake-server-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cli_archive: krake-windows-x86_64.zip
            server_archive: krake-server-windows-x86_64.zip

    steps:
      - name: Require pinned signing keys
        shell: bash
        run: |
          for var in KRAKE_REGISTRY_PUBKEY_HEX KRAKE_UPDATE_PUBKEY_HEX; do
            if [ -z "${!var}" ]; then
              echo "::error::Repository variable $var is not set; release builds must pin a real Ed25519 public key."
              exit 1
            fi
          done

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          # wasm32: the plugin guest, built by crates/plugin-runtime/build.rs
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install protobuf compiler, clang and lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang lld

      # Apple's clang has no WebAssembly target; Homebrew's LLVM builds the
      # plugin guest.
      - name: Install protobuf compiler and LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf llvm
          echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      # rquickjs-sys hands clang its vendored libc headers as a verbatim
      # `\\?\C:\...` path, in which `bits/alltypes.h` (a forward slash) is
      # not found. Clang drops a second -isystem entry for the same folder
      # as a duplicate, so the headers go in as a copy under a plain path;
      # that makes the plugin guest (crates/plugin-guest, built by
      # crates/plugin-runtime/build.rs) build.
      - name: Plain include path for the plugin guest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo fetch --manifest-path crates/plugin-guest/Cargo.toml
          dir=$(cargo metadata --format-version 1 --manifest-path crates/plugin-guest/Cargo.toml \
            | jq -r '.packages[] | select(.name == "rquickjs-sys") | .manifest_path' | head -1)
          dir="${dir//\\//}"
          include="$(dirname "$dir")/vendor/wasi-libc/include"
          copy="${RUNNER_TEMP//\\//}/wasi-libc-include"
          rm -rf "$copy"
          cp -r "$include" "$copy"
          test -f "$copy/bits/alltypes.h"
          echo "CFLAGS_wasm32_unknown_unknown=-isystem $copy" >> "$GITHUB_ENV"

      - name: Create web-ui dist stub
        run: mkdir -p web-ui/dist

      - name: Install cross tool
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build CLI and Server
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p krake-cli -p krake-server -p krake-plugin-runtime

      - name: Build CLI and Server (cross)
        if: ${{ matrix.cross }}
        run: cross build --release --target ${{ matrix.target }} -p krake-cli -p krake-server -p krake-plugin-runtime

      # Both archives carry krake-plugin-host: the CLI and the server each
      # run plugins in it and look for it next to their own executable.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release

          tar czf ../../../${{ matrix.cli_archive }} krake krake-plugin-host
          cd ../../..
          sha256sum ${{ matrix.cli_archive }} > ${{ matrix.cli_archive }}.sha256

          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.server_archive }} krake-server krake-plugin-host
          cd ../../..
          sha256sum ${{ matrix.server_archive }} > ${{ matrix.server_archive }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/krake.exe, target/${{ matrix.target }}/release/krake-plugin-host.exe -DestinationPath ${{ matrix.cli_archive }}
          (Get-FileHash ${{ matrix.cli_archive }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.cli_archive }}" | Out-File -Encoding ascii ${{ matrix.cli_archive }}.sha256

          Compress-Archive -Path target/${{ matrix.target }}/release/krake-server.exe, target/${{ matrix.target }}/release/krake-plugin-host.exe -DestinationPath ${{ matrix.server_archive }}
          (Get-FileHash ${{ matrix.server_archive }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.server_archive }}" | Out-File -Encoding ascii ${{ matrix.server_archive }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            ${{ matrix.cli_archive }}
            ${{ matrix.cli_archive }}.sha256
            ${{ matrix.server_archive }}
            ${{ matrix.server_archive }}.sha256

  # ─── Docker Image (multi-arch) ─────────────────────────────────────
  docker:
    name: Docker (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version parts
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MAJOR.$MINOR" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/amigo-labs/krake:latest
            ghcr.io/amigo-labs/krake:${{ inputs.version }}
            ghcr.io/amigo-labs/krake:${{ steps.version.outputs.minor }}
            ghcr.io/amigo-labs/krake:${{ steps.version.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            KRAKE_REGISTRY_PUBKEY_HEX=${{ vars.AMIGO_UPDATE_PUBKEY_HEX }}
            KRAKE_UPDATE_PUBKEY_HEX=${{ vars.AMIGO_UPDATE_PUBKEY_HEX }}

  # ─── Desktop Installers (Tauri) ────────────────────────────────────
  installers:
    name: Installer (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `asset` is the stable name prefix of the desktop release assets
          # (docs/specs/desktop-app.md, AC-22), so that
          # releases/latest/download/<name> always resolves.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: krake-linux-x64
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: krake-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: krake-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: krake-windows-x64

    steps:
      # The updater artifacts (createUpdaterArtifacts in tauri.conf.json) are
      # signed with the organization's minisign key (ID 3098504C1538B8F6);
      # without it the build fails late or, worse, ships unsigned (AC-24).
      - name: Require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=0
          for var in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::Organization secret $var is not available to this repository; desktop releases sign their updater artifacts with it (docs/specs/desktop-app.md, AC-24)."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          # wasm32: the plugin guest, built by crates/plugin-runtime/build.rs
          targets: ${{ matrix.target }},wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-release-${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf protobuf-compiler clang lld

      # Apple's clang has no WebAssembly target; Homebrew's LLVM builds the
      # plugin guest.
      - name: Install protobuf compiler and LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf llvm
          echo "CC_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_unknown_unknown=$(brew --prefix llvm)/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y

      # rquickjs-sys hands clang its vendored libc headers as a verbatim
      # `\\?\C:\...` path, in which `bits/alltypes.h` (a forward slash) is
      # not found. Clang drops a second -isystem entry for the same folder
      # as a duplicate, so the headers go in as a copy under a plain path;
      # that makes the plugin guest (crates/plugin-guest, built by
      # crates/plugin-runtime/build.rs) build.
      - name: Plain include path for the plugin guest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo fetch --manifest-path crates/plugin-guest/Cargo.toml
          dir=$(cargo metadata --format-version 1 --manifest-path crates/plugin-guest/Cargo.toml \
            | jq -r '.packages[] | select(.name == "rquickjs-sys") | .manifest_path' | head -1)
          dir="${dir//\\//}"
          include="$(dirname "$dir")/vendor/wasi-libc/include"
          copy="${RUNNER_TEMP//\\//}/wasi-libc-include"
          rm -rf "$copy"
          cp -r "$include" "$copy"
          test -f "$copy/bits/alltypes.h"
          echo "CFLAGS_wasm32_unknown_unknown=-isystem $copy" >> "$GITHUB_ENV"

      # The web UI is a pnpm workspace package (it depends on packages/ui
      # through `workspace:*`); there is no package-lock.json for `npm ci`.
      - name: Build Web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @amigo-labs/krake-web-ui build

      # No package.json carries @tauri-apps/cli; the Rust CLI builds the
      # installer. The desktop crate only builds the app with its `tauri`
      # feature on.
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The app runs plugins in krake-plugin-host, bundled as a Tauri sidecar
      # (bundle.externalBin). Tauri looks for it under its target-triple name
      # (docs/specs/desktop-app.md, AC-7).
      - name: Build the plugin host sidecar
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p krake-plugin-runtime --bin krake-plugin-host
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          mkdir -p tauri/binaries
          cp "target/${{ matrix.target }}/release/krake-plugin-host$ext" \
            "tauri/binaries/krake-plugin-host-${{ matrix.target }}$ext"
          ls -l tauri/binaries

      # tauri-cli signs every updater artifact with the minisign key.
      - name: Build Tauri installer
        working-directory: tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.target }} --features tauri

      # Bundle names carry the version (Krake_0.2.0_x64-setup.exe); the
      # release assets get stable names, each updater artifact with its .sig
      # (AC-19, AC-22). Exactly one file must match each bundle pattern.
      - name: Stable asset names
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle="target/${{ matrix.target }}/release/bundle"
          out="desktop-assets"
          mkdir -p "$out"
          take() { # <pattern> <stable name> <updater artifact: yes|no>
            local matches=($1)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::expected exactly one $1, found ${#matches[@]}: ${matches[*]:-none}"
              exit 1
            fi
            cp "${matches[0]}" "$out/$2"
            if [ "$3" = yes ]; then
              if [ ! -s "${matches[0]}.sig" ]; then
                echo "::error::${matches[0]} has no updater signature (.sig)"
                exit 1
              fi
              cp "${matches[0]}.sig" "$out/$2.sig"
            fi
          }
          a="${{ matrix.asset }}"
          case "$RUNNER_OS" in
            Windows)
              take "$bundle/nsis/*-setup.exe" "$a-setup.exe" yes
              take "$bundle/msi/*.msi" "$a.msi" yes
              ;;
            macOS)
              take "$bundle/dmg/*.dmg" "$a.dmg" no
              take "$bundle/macos/*.app.tar.gz" "$a.app.tar.gz" yes
              ;;
            Linux)
              take "$bundle/appimage/*.AppImage" "$a.AppImage" yes
              take "$bundle/deb/*.deb" "$a.deb" no
              ;;
          esac
          ls -l "$out"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: desktop-assets/*
          if-no-files-found: error

  # ─── Upload to GitHub Release + Tauri Updater JSON ─────────────────
  upload:
    name: Upload release artifacts
    needs: [cli, docker, installers]
    runs-on: ubuntu-latest
    steps:
      # The tag's tauri.conf.json holds the pubkey the installers were built
      # with, which the key-ID guard checks against.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      # The self-updater (krake-server, krake) refuses a release without a
      # `.sig` next to its archive. The secret holds the private seed matching
      # KRAKE_UPDATE_PUBKEY_HEX; the script fails if they differ.
      # See docs/specs/self-update.md.
      - name: Sign CLI and server archives
        env:
          KRAKE_UPDATE_SIGNING_KEY: ${{ secrets.AMIGO_UPDATE_SIGNING_KEY }}
        run: scripts/sign-update-archives.sh artifacts

      # Every desktop updater signature must carry the key ID of
      # plugins.updater.pubkey, or every installed copy would reject the
      # update (AC-21). A key rotation's bridge release sets the repository
      # variable UPDATER_SIGNING_KEY_ID to the new key's ID.
      - name: Check the updater signature key ID
        env:
          UPDATER_SIGNING_KEY_ID: ${{ vars.UPDATER_SIGNING_KEY_ID }}
        run: node scripts/updater-key-id-guard.mjs artifacts --conf tauri/tauri.conf.json

      # Tauri 2 updater manifest; fails when any platform's signature is
      # missing (AC-20).
      - name: Generate Tauri updater JSON
        run: >-
          node scripts/updater-latest-json.mjs artifacts
          --version "${{ inputs.version }}"
          --tag "${{ inputs.tag_name }}"
          --repo "${{ github.repository }}"

      # One list of every downloadable file's hash, next to the per-file
      # .sha256 files (which scripts/install.sh uses). amigo-labs.dev links it
      # (docs/site/project.yml, downloads.checksums).
      - name: SHA256SUMS
        working-directory: artifacts
        run: |
          # SHA256SUMS itself is excluded: the redirection creates it before
          # find lists the directory.
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name '*.sig' ! -name 'latest.json' ! -name SHA256SUMS -printf '%f\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag_name }}
          # Release title "Krake X.Y.Z", like "Pincel X.Y.Z" and
          # "Blinzel X.Y.Z"; replaces the name release-please gave it.
          name: Krake ${{ inputs.version }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: "artifacts/*"
