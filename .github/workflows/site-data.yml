# Checks the project data for amigo-labs.dev: validates docs/site/ against the
# site's schema and fails when assets/brand/ (the app icons made from the pixel
# monogram) or packages/ui/src/theme/ (the shared amigo app theme with Krake's
# accent, docs/specs/amigo-theme.md) no longer matches docs/site/project.yml.
# The checks live in amigo-labs/website (docs/project-data.md); regenerate there:
# `node scripts/monogram.ts amigo-labs/amigo-krake --out ../amigo-krake/assets/brand --tauri ../amigo-krake/tauri/icons`
# `node scripts/theme.ts amigo-labs/amigo-krake --out ../amigo-krake/packages/ui/src/theme`

name: Site data

on:
  pull_request:
    paths:
      - docs/site/**
      - assets/brand/**
      - packages/ui/src/theme/**
      - .github/workflows/site-data.yml

permissions:
  contents: read

jobs:
  site-data:
    uses: amigo-labs/website/.github/workflows/validate-project.yml@main
    with:
      theme-dir: packages/ui/src/theme
